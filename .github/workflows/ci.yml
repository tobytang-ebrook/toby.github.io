name: CI

# PR #1: build and type/schema check only. Deployment is added at cutover (Phase 5).
on:
  push:
    branches: [astro-site]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
